<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Profiles</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <section class="inicio">
      <header class="header">
        <div class="header-content">
          <div class="logo">SCREEN</div>

          <nav class="menu">
            <a href="#">Filmes</a>
            <a href="#">Séries</a>
            <a href="#">Favoritos</a>
            <a href="#">Sobre</a>
          </nav>
        </div>
      </header>
    </section>

    <section class="categorias">
      <div class="categorias-content">
        <button class="categoria ativa">Todos</button>
        <button class="categoria">Ação</button>
        <button class="categoria">Aventura</button>
        <button class="categoria">Comédia</button>
        <button class="categoria">Drama</button>
        <button class="categoria">Terror</button>
        <button class="categoria">Romance</button>
        <button class="categoria">Ficção científica</button>
      </div>
    </section>
    <section class="pesquisa">
      <div class="search-box">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" placeholder="Pesquisar filmes ou séries..." />
      </div>
    </section>

    <section class="filmes-container">
      <div id="grid-filmes"  class="grid-filmes">
        <div class="card-filme">
          <div class="poster-box">
            <img src="https://via.placeholder.com/300x450" alt="Capa do Filme" />
          </div>
          <div class="info-filme">
            <h3 class="titulo-filme"> Título do filme</h3>
            <p class="genero-filme"> ação, aventura</p>
          </div>
        </div>
      </div>
    </section>
    <!-- Barra de Pesquisa -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
  </body>
</html>
